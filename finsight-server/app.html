function autoCat(payee, desc, amount) {
  const text = (payee + " " + desc).toLowerCase();
  for (const r of state.config.rules) if (text.includes(r.kw)) return r.cat;
  // Twee rondes: eerst labels van de passende soort (inkomst/uitgave), dan de rest —
  // zo wordt "Belastingdienst Toeslagen" +€107 een toeslag en een aanslag −€500 een belasting.
  const prefer = amount > 0 ? "income" : "expense";
  for (const pass of [0, 1]) {
    for (const [catId, kws] of Object.entries(DICT)) {
      const cat = catById(catId);
      if (!cat) continue;
      if ((cat.kind === prefer) !== (pass === 0)) continue;
      if (cat.kind === "income" && amount < 0) continue;
      if (kws.some((k) => text.includes(k))) return catId;
    }
  }
  return amount > 0 ? "overig-in" : null;
}

/* ========== CSV-parsers ========== */
function splitLine(line, sep) {
  const out = []; let cur = "", q = false;
  for (let i = 0; i < line.length; i++) {
    const ch = line[i];
    if (q) { if (ch === '"' && line[i+1] === '"') { cur += '"'; i++; } else if (ch === '"') q = false; else cur += ch; }
    else { if (ch === '"') q = true; else if (ch === sep) { out.push(cur); cur = ""; } else cur += ch; }
  }
  out.push(cur);
  return out.map((s) => s.trim());
}
function parseAmount(s) {
  let t = String(s).replace(/\s|€/g, "");
  if (/,\d{1,2}$/.test(t)) t = t.replace(/\./g, "").replace(",", ".");
  else t = t.replace(/,/g, "");
  const v = parseFloat(t);
  return Math.round((isNaN(v) ? 0 : v) * 100);
}
function parseDate(s) {
  s = String(s).trim().replace(/"/g, "");
  let m = s.match(/^(\d{4})-?(\d{2})-?(\d{2})$/);
  if (m) return m[1] + "-" + m[2] + "-" + m[3];
  m = s.match(/^(\d{1,2})[-/](\d{1,2})[-/](\d{4})$/);
  if (m) return m[3] + "-" + m[2].padStart(2,"0") + "-" + m[1].padStart(2,"0");
  return null;
}
function parseBankCsv(content) {
  const lines = content.split(/\r?\n/).filter((l) => l.trim());
  if (!lines.length) return { bank: "onbekend", rows: [] };
  const header = lines[0].toLowerCase();
  const sep = header.split(";").length > header.split(",").length ? ";" : ",";
  const cols = splitLine(lines[0], sep).map((c) => c.toLowerCase().replace(/"/g, ""));
  const idx = (...names) => cols.findIndex((c) => names.some((n) => c.includes(n)));
  const rows = [];
  const push = (date, amount, payee, desc) => { if (date) rows.push({ date, amount, payee: payee || "Onbekend", desc: desc || "" }); };
  if (header.includes("af bij") || (header.includes("naam / omschrijving") && header.includes("bedrag"))) {
    const iD = idx("datum"), iN = idx("naam"), iDir = idx("af bij"), iA = idx("bedrag"), iM = idx("mededelingen");
    for (const l of lines.slice(1)) { const f = splitLine(l, sep); let a = parseAmount(f[iA] ?? "0");
      a = (f[iDir] ?? "").toLowerCase().includes("af") ? -Math.abs(a) : Math.abs(a);
      push(parseDate(f[iD] ?? ""), a, f[iN], iM >= 0 ? f[iM] : ""); }
    return { bank: "ING", rows };
  }
  if (header.includes("naam tegenpartij") || header.includes("volgnr")) {
    const iD = idx("datum"), iA = idx("bedrag"), iN = idx("naam tegenpartij"), iM = idx("omschrijving");
    for (const l of lines.slice(1)) { const f = splitLine(l, sep);
      push(parseDate(f[iD] ?? ""), parseAmount(f[iA] ?? "0"), f[iN], iM >= 0 ? f[iM] : ""); }
    return { bank: "Rabobank", rows };
  }
  if (header.includes("transactiedatum") || header.includes("muntsoort")) {
    const iD = idx("transactiedatum"), iA = idx("transactiebedrag"), iM = idx("omschrijving");
    for (const l of lines.slice(1)) { const f = splitLine(l, sep); const desc = f[iM] ?? "";
      const payee = (desc.match(/Naam:\s*([^/]+)/i) || [])[1]?.trim() || desc.slice(0, 40);
      push(parseDate(f[iD] ?? ""), parseAmount(f[iA] ?? "0"), payee, desc); }
    return { bank: "ABN AMRO", rows };
  }
  // bunq-export: "Date","Interest Date","Amount","Account","Counterparty","Name","Description"
  if (header.includes("interest date") || (header.includes("counterparty") && header.includes("name"))) {
    const iD = idx("date"), iA = idx("amount"), iN = cols.findIndex((c) => c === "name"), iC = idx("counterparty"), iM = idx("description");
    for (const l of lines.slice(1)) { const f = splitLine(l, sep);
      const payee = (iN >= 0 && f[iN]) || (iC >= 0 && f[iC]) || "Onbekend";
      push(parseDate(f[iD] ?? ""), parseAmount(f[iA] ?? "0"), payee, iM >= 0 ? (f[iM] || "").replace(/^"+|"+$/g, "").trim() : ""); }
    return { bank: "bunq", rows };
  }
  const iD = idx("date","datum"), iA = idx("amount","bedrag"), iN = idx("payee","naam","name","tegenpartij","counterparty","merchant","omschrijving");
  if (iD >= 0 && iA >= 0) {
    const iM = idx("description","mededeling","notitie");
    for (const l of lines.slice(1)) { const f = splitLine(l, sep);
      push(parseDate(f[iD] ?? ""), parseAmount(f[iA] ?? "0"), iN >= 0 ? f[iN] : "Onbekend", iM >= 0 ? f[iM] : ""); }
    return { bank: "generiek", rows };
  }
  return { bank: "onbekend", rows: [] };
}

/* ========== inzichten ========== */
/* 'Kluis-opname' en 'Potje-overboeking' zijn verplaatsingen tussen eigen potjes
   (bank↔kluis, bank↔spaarpot): geen echte uitgave of inkomst, dus niet in de
   statistieken — wél in de saldi van de potjes zelf. */
const isTransfer = (t) => t.cat === "kluis" || t.cat === "potje";
function monthlyStats(n = 12) {
  const map = {};
  for (const t of allTx()) {
    if (isTransfer(t)) continue;
    const ym = t.date.slice(0,7);
    map[ym] = map[ym] || { month: ym, income: 0, expense: 0 };
    if (t.amount > 0) map[ym].income += t.amount; else map[ym].expense += -t.amount;
  }
  return Object.values(map).sort((a,b) => a.month < b.month ? -1 : 1).slice(-n).map((s) => ({ ...s, net: s.income - s.expense }));
}
function spendPerCat(month) {
  const map = {};
  for (const t of allTx()) if (t.amount < 0 && t.date.slice(0,7) === month && !isTransfer(t)) {
    const k = t.cat || "_none"; map[k] = (map[k] || 0) + -t.amount;
  }
  return Object.entries(map).map(([k,v]) => ({ cat: k === "_none" ? null : catById(k), id: k, total: v })).sort((a,b) => b.total - a.total);
}
function saldo() {
  const start = state.hh === "kant" ? (state.config?.kantStart || 0) : (state.config?.startBalance || 0);
  return start + allTx().filter((t) => !t.acc).reduce((a,t) => a + t.amount, 0);
}
function cashSaldo() { return (state.config?.cashStart || 0) + allTx().filter((t) => t.acc === "cash").reduce((a,t) => a + t.amount, 0); }
function hasCash() { return (state.config?.cashStart || 0) !== 0 || allTx().some((t) => t.acc === "cash"); }
function spaarSaldo() { return (state.config?.spaarStart || 0) + allTx().filter((t) => t.acc === "spaar").reduce((a,t) => a + t.amount, 0); }
function hasSpaar() { return (state.config?.spaarStart || 0) !== 0 || allTx().some((t) => t.acc === "spaar"); }
function kantSaldo() { return (state.config?.kantStart || 0) + allTxAll().filter((t) => t.hh === "kant" && !t.acc).reduce((a,t) => a + t.amount, 0); }
function hasKant() { return (state.config?.kantStart || 0) !== 0 || allTxAll().some((t) => t.hh === "kant"); }
function normPayee(p) { return p.toLowerCase().replace(/\d+/g,"").replace(/[^a-z& ]/g," ").replace(/\s+/g," ").trim().slice(0,28); }
function detectRecurring() {
  const groups = {};
  for (const t of allTx().slice().reverse()) if (t.amount < 0 && !isTransfer(t)) {
    const k = normPayee(t.payee); if (!k) continue; (groups[k] = groups[k] || []).push(t);
  }
  const out = [];
  for (const list of Object.values(groups)) {
    if (list.length < 2) continue;
    const ds = list.map((t) => new Date(t.date + "T00:00:00").getTime());
    const iv = []; for (let i = 1; i < ds.length; i++) iv.push((ds[i]-ds[i-1])/864e5);
    const avgI = iv.reduce((a,b)=>a+b,0)/iv.length;
    const monthly = avgI >= 23 && avgI <= 38, weekly = avgI >= 5 && avgI <= 9, yearly = avgI >= 330 && avgI <= 400;
    if (!monthly && !weekly && !yearly) continue;
    const am = list.map((t) => -t.amount), avgA = am.reduce((a,b)=>a+b,0)/am.length;
    if (avgA <= 0 || Math.max(...am.map((a)=>Math.abs(a-avgA))) > Math.max(avgA*0.25, 500)) continue;
    const last = list[list.length-1];
    const next = new Date(new Date(last.date+"T00:00:00").getTime() + Math.round(avgI)*864e5);
    out.push({ payee: last.payee, cat: last.cat, avgAmount: Math.round(avgA), count: list.length, intervalDays: Math.round(avgI),
      lastDate: last.date, nextExpected: next.toISOString().slice(0,10), yearlyCost: Math.round(avgA * (weekly ? 52 : monthly ? 12 : 1)) });
  }
  return out.sort((a,b) => b.yearlyCost - a.yearlyCost);
}
function detectAnomalies(month) {
  const out = [];
  for (const c of state.config.cats.filter((c) => c.kind === "expense")) {
    const hist = {};
    for (const t of allTx()) if (t.cat === c.id && t.amount < 0 && t.date.slice(0,7) < month) {
      const ym = t.date.slice(0,7); hist[ym] = (hist[ym] || 0) + -t.amount;
    }
    const months = Object.keys(hist).sort().slice(-3);
    if (months.length < 2) continue;
    const avg = months.reduce((a,m) => a + hist[m], 0) / months.length;
    const cur = allTx().filter((t) => t.cat === c.id && t.amount < 0 && t.date.slice(0,7) === month).reduce((a,t) => a + -t.amount, 0);
    if (avg > 1000 && cur > avg * 1.3 && cur - avg > 2500)
      out.push({ name: c.name, color: c.color, glyph: c.glyph, thisMonth: cur, avg: Math.round(avg), pct: Math.round((cur-avg)/avg*100) });
  }
  return out.sort((a,b) => b.pct - a.pct);
}
function avgNet() {
  const cur = dezeMaand();
  const done = monthlyStats(4).filter((s) => s.month < cur).slice(-3);
  return done.length ? done.reduce((a,b) => a + b.net, 0) / done.length : 0;
}
function forecast(n = 6) {
  let bal = saldo(); const out = []; const now = new Date(); const net = avgNet();
  for (let i = 1; i <= n; i++) { const d = new Date(now.getFullYear(), now.getMonth()+i, 1); bal += net; out.push({ month: d.toISOString().slice(0,7), v: Math.round(bal) }); }
  return out;
}
function savingsRate(month) {
  const s = monthlyStats(24).find((x) => x.month === month);
  if (!s || !s.income) return null;
  return Math.round((s.income - s.expense) / s.income * 100);
}

/* ========== charts ========== */
function chartBars(data) {
  const W = 640, H = 200, pl = 46, pb = 24, pt = 8;
  const max = Math.max(1, ...data.map((d) => Math.max(d.income, d.expense)));
  const iw = W - pl - 8, ih = H - pt - pb, gw = iw / Math.max(1, data.length), bw = Math.min(14, gw/2 - 3);
  const y = (v) => pt + ih - v / max * ih;
  let s = "";
  for (const f of [0, 0.5, 1]) { const t = max*f;
    s += `<line x1="${pl}" x2="${W-8}" y1="${y(t)}" y2="${y(t)}" stroke="var(--grid)"/><text x="${pl-7}" y="${y(t)+3.5}" font-size="10" fill="var(--ink-3)" text-anchor="end">${euroK(Math.round(t))}</text>`; }
  data.forEach((d, i) => {
    const cx = pl + i*gw + gw/2;
    const lbl = MONTH_NAMES[+d.month.slice(5)-1];
    s += `<rect x="${cx-bw-1}" y="${y(d.income)}" width="${bw}" height="${Math.max(2, pt+ih-y(d.income))}" rx="3.5" fill="var(--chart-in)"><title>${lbl}: in ${euro(d.income)}</title></rect>`;
    s += `<rect x="${cx+1}" y="${y(d.expense)}" width="${bw}" height="${Math.max(2, pt+ih-y(d.expense))}" rx="3.5" fill="var(--chart-out)"><title>${lbl}: uit ${euro(d.expense)}</title></rect>`;
    s += `<text x="${cx}" y="${H-6}" font-size="10" fill="var(--ink-3)" text-anchor="middle">${lbl}</text>`;
  });
  return `<div class="legend"><span><span class="dotl" style="background:var(--chart-in)"></span>Inkomsten</span><span><span class="dotl" style="background:var(--chart-out)"></span>Uitgaven</span></div>
  <svg viewBox="0 0 ${W} ${H}" style="width:100%" role="img" aria-label="Inkomsten en uitgaven per maand">${s}</svg>`;
}
function chartDonut(items, size = 140) {
  const total = items.reduce((a,b) => a + b.value, 0) || 1;
  const r = size/2 - 11, c = size/2, C = 2*Math.PI*r;
  let acc = 0, s = "";
  for (const it of items) {
    const f = it.value/total, dash = Math.max(0, f*C - 2.5);
    s += `<circle cx="${c}" cy="${c}" r="${r}" fill="none" stroke="${it.color}" stroke-width="16" stroke-linecap="round" stroke-dasharray="${dash} ${C-dash}" stroke-dashoffset="${-acc*C + C/4}"><title>${esc(it.label)}: ${Math.round(f*100)}%</title></circle>`;
    acc += f;
  }
  return `<svg viewBox="0 0 ${size} ${size}" width="${size}" height="${size}" role="img" aria-label="Verdeling uitgaven">${s}</svg>`;
}
/* Vermogensverloop: doorgetrokken lijn + vulling = werkelijk saldo per maandeinde,
   stippellijn = prognose op het huidige tempo. */
function wealthSeries() {
  const stats = monthlyStats(999);
  let run = state.config?.startBalance || 0;
  const hist = stats.map((s) => { run += s.net; return { month: s.month, v: run }; });
  return hist.slice(-9);
}
function chartWealth(hist, fut) {
  const W = 640, H = 200, pl = 54, pb = 20, pt = 10;
  const pts = [...hist.map((p) => ({ ...p, f: false })), ...fut.map((p) => ({ month: p.month, v: p.v, f: true }))];
  if (pts.length < 2) return "";
  const vals = pts.map((p) => p.v);
  const min = Math.min(...vals), max = Math.max(...vals), span = Math.max(1, max - min);
  const iw = W - pl - 16, ih = H - pt - pb;
  const x = (i) => pl + i / (pts.length - 1) * iw, y = (v) => pt + ih - (v - min) / span * ih;
  const hn = hist.length;
  let solid = "", dash = "";
  pts.forEach((p, i) => {
    const pt2 = `${x(i)},${y(p.v)}`;
    if (i < hn) solid += (i ? " L" : "M") + pt2;
    if (i >= hn - 1) dash += (i === hn - 1 ? "M" : " L") + pt2;
  });
  const areaPath = solid + ` L${x(hn-1)},${pt+ih} L${x(0)},${pt+ih} Z`;
  let s = `<defs><linearGradient id="fg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="rgba(10,132,255,0.25)"/><stop offset="1" stop-color="rgba(10,132,255,0)"/></linearGradient></defs>`;
  for (const t of [min, (min+max)/2, max])
    s += `<line x1="${pl}" x2="${W-16}" y1="${y(t)}" y2="${y(t)}" stroke="var(--grid)"/><text x="${pl-7}" y="${y(t)+3.5}" font-size="10" fill="var(--ink-3)" text-anchor="end">${euroK(Math.round(t))}</text>`;
  s += `<path d="${areaPath}" fill="url(#fg)"/>`;
  s += `<path d="${solid}" fill="none" stroke="var(--chart-in)" stroke-width="2.2" stroke-linejoin="round"/>`;
  s += `<path d="${dash}" fill="none" stroke="var(--chart-in)" stroke-width="2" stroke-dasharray="5 6" stroke-linejoin="round" opacity="0.8"/>`;
  const step = Math.ceil(pts.length / 8);
  pts.forEach((p, i) => {
    const lbl = MONTH_NAMES[+p.month.slice(5)-1];
    s += `<circle cx="${x(i)}" cy="${y(p.v)}" r="${i === hn - 1 ? 4.6 : 3.2}" fill="${p.f ? "var(--card)" : "var(--chart-in)"}" stroke="var(--chart-in)" stroke-width="2"><title>${lbl}: ${euro(p.v)}${p.f ? " (prognose)" : ""}</title></circle>`;
    if (i % step === 0 || i === pts.length - 1) s += `<text x="${x(i)}" y="${H-2}" font-size="10" fill="var(--ink-3)" text-anchor="middle">${lbl}</text>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%" role="img" aria-label="Vermogensverloop en prognose">${s}</svg>`;
}

/* ========== demodata ========== */
function mulberry(a){return function(){a|=0;a=a+0x6d2b79f5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function loadDemo() {
  if (allTx().length) { toast("Er zijn al transacties — demodata laden kan alleen in een lege app."); return; }
  const rnd = mulberry(42);
  const today = new Date(); const iso = (d) => d.toISOString().slice(0,10);
  const day = (y,m,dd) => new Date(Date.UTC(y, m, Math.min(dd, 28)));
  const add = (date, amount, payee, desc) => {
    const ym = date.slice(0,7);
    (state.months[ym] = state.months[ym] || []).push({ id: uid(), date, amount, payee, desc: desc || "", cat: autoCat(payee, desc || "", amount) });
  };
  for (let back = 8; back >= 0; back--) {
    const ref = new Date(Date.UTC(today.getUTCFullYear(), today.getUTCMonth()-back, 1));
    const y = ref.getUTCFullYear(), m = ref.getUTCMonth();
    const dim = back === 0 ? today.getUTCDate() : 28;
    add(iso(day(y,m,25)), 325000 + Math.round(rnd()*2000), "Salaris TechWorks B.V.", "Salaris");
    add(iso(day(y,m,1)), -142500, "Woningstichting De Sleutel", "Huur");
    if (dim>=3) add(iso(day(y,m,3)), -16800, "Vattenfall", "Energie");
    if (dim>=5) add(iso(day(y,m,5)), -6250, "Ziggo", "Internet & TV");
    if (dim>=7) add(iso(day(y,m,7)), -1399, "Netflix", "Abonnement");
    if (dim>=8) add(iso(day(y,m,8)), -1099, "Spotify", "Premium");
    if (dim>=10) add(iso(day(y,m,10)), -2999, "Basic-Fit", "Sportschool");
    if (dim>=12) add(iso(day(y,m,12)), -14550, "Zilveren Kruis", "Zorgverzekering");
    if (dim>=20) add(iso(day(y,m,20)), 10700, "Belastingdienst Toeslagen", "Zorgtoeslag");
    if (dim>=26) add(iso(day(y,m,26)), -50000, "Naar spaarrekening", "Automatisch sparen");
    const sup = ["Albert Heijn","Jumbo","Lidl"];
    for (let w = 0; w < 4; w++) { const d = 2 + w*7 + Math.floor(rnd()*3); if (d > dim) break;
      add(iso(day(y,m,d)), -(4500+Math.round(rnd()*5500)), sup[Math.floor(rnd()*3)], "Boodschappen"); }
    for (let i = 0; i < 2+Math.floor(rnd()*3); i++) { const d = 1+Math.floor(rnd()*27); if (d > dim) continue;
      const pl = [["Thuisbezorgd.nl",2800],["Restaurant De Gouden Leeuw",5400],["Starbucks",850]][Math.floor(rnd()*3)];
      add(iso(day(y,m,d)), -(pl[1]+Math.round(rnd()*1500)), pl[0], "Uit eten"); }
    for (let i = 0; i < 2; i++) { const d = 4+Math.floor(rnd()*22); if (d > dim) continue;
      add(iso(day(y,m,d)), -(2000+Math.round(rnd()*3000)), rnd() > 0.5 ? "NS Groep" : "Shell Station", "Vervoer"); }
    if (rnd() > 0.4) { const d = 6+Math.floor(rnd()*18); if (d <= dim) {
      const sh = [["bol.com",3500],["Coolblue",8900],["HEMA",1800]][Math.floor(rnd()*3)];
      add(iso(day(y,m,d)), -(sh[1]+Math.round(rnd()*4000)), sh[0], "Online aankoop"); } }
  }
  state.config.startBalance = 245000;
  state.config.goals = [
    { id: uid(), name: "Noodbuffer", target: 1000000, saved: 820000, deadline: null },
    { id: uid(), name: "Vakantie Japan", target: 450000, saved: 180000, deadline: null },
  ];
  for (const ym of Object.keys(state.months)) saveMonth(ym);
  saveConfig();
  render();
  toast("Demodata geladen — 9 maanden voorbeeldtransacties.");
}

/* ========== vaste lasten & schulden ========== */
const DEBT_STATUS = {
  direct: { label: "Nu te betalen", color: "var(--red)" },
  uitstel: { label: "Uitstel verlopen", color: "var(--red)" },
  regeling: { label: "Betalingsregeling", color: "var(--orange)" },
  open: { label: "Open", color: "var(--ink-3)" },
};
function debtStatusFrom(text) {
  const t = (text || "").toLowerCase();
  if (t.includes("achterstand")) return "direct";
  if (t.includes("uitstel")) return "uitstel";
  if (t.includes("regeling")) return "regeling";
  return "open";
}
function normWho(w) {
  w = String(w || "").trim();
  if (!w || /^gezamen/i.test(w) || /^samen$/i.test(w)) return "";
  return w[0].toUpperCase() + w.slice(1).toLowerCase();
}
function whoFrom(name) {
  const m = name.match(/\(\s*([A-Za-zÀ-ÿ]+)\s*\)/);
  if (m) return normWho(m[1]);
  const s = name.match(/salaris\s+([A-Za-zÀ-ÿ]+)/i);
  if (s) return normWho(s[1]);
  return "";
}
/* Leest één tabblad in het 'Vaste lasten & schulden'-formaat:
   kolom A categorie, B kostenpost/schuld, C maandbedrag (negatief = inkomst),
   D status/notitie, E.. achterstand-/schuldbedragen. */
function parseFixedSheet(rows, groupName) {
  const items = [], debts = [];
  for (const r of rows.slice(1)) {
    const name = String(r[1] || "").trim();
    if (!name || /^totale/i.test(String(r[0] || "")) || /^totale/i.test(name)) continue;
    const note = String(r[3] || "").trim();
    const monthly = parseAmount(r[2] || "");
    let debtTotal = 0;
    for (let i = 4; i < r.length; i++) {
      const v = parseAmount(r[i] || "");
      if (v > 0) debtTotal += v;
    }
    const who = whoFrom(name);
    if (monthly !== 0) {
      items.push({ id: uid(), name, amount: monthly, who, group: groupName, note: debtTotal ? "" : note });
    }
    if (debtTotal > 0) {
      debts.push({ id: uid(), name, total: debtTotal, paid: 0, status: debtStatusFrom(note), note, group: groupName, who: whoFrom(name) });
    }
  }
  return { items, debts };
}
function importFixed(input) {
  const file = input.files?.[0];
  if (!file) return;
  loadXLSX()
    .then(() => file.arrayBuffer())
    .then((buf) => {
      const wb = XLSX.read(buf, { type: "array" });
      const pick = (sheetName) => {
        const rows = XLSX.utils.sheet_to_json(wb.Sheets[sheetName], { header: 1, raw: false, defval: "" });
        const { items, debts } = parseFixedSheet(rows, sheetName.trim());
        if (!items.length && !debts.length) { toast("Geen posten herkend op dit tabblad."); return; }
        const seenI = new Set(state.fixed.items.map((i) => i.group + "|" + i.name + "|" + i.amount));
        const seenD = new Set(state.fixed.debts.map((d) => d.group + "|" + d.name + "|" + d.total));
        let ni = 0, nd = 0;
        for (const it of items) if (!seenI.has(it.group + "|" + it.name + "|" + it.amount)) { state.fixed.items.push(it); ni++; }
        for (const d of debts) if (!seenD.has(d.group + "|" + d.name + "|" + d.total)) { state.fixed.debts.push(d); nd++; }
        saveFixed(); closeSheet(); render(); buzz();
        toast(`${ni} vaste lasten en ${nd} schulden geïmporteerd uit "${sheetName.trim()}".`);
      };
      if (wb.SheetNames.length === 1) { pick(wb.SheetNames[0]); return; }
      window.__pickSheet = pick;
      openSheet(`
        <div class="grab"></div>
        <h3>Welk tabblad importeren?</h3>
        <p class="muted" style="margin:4px 0 12px">Dit Excel-bestand heeft meerdere tabbladen. Tip: importeer het gezamenlijke overzicht, niet ook nog de persoonlijke kopie (dan telt alles dubbel).</p>
        <div class="formgrid">
          ${wb.SheetNames.map((n, i) => `<button class="btn sec" onclick="__pickSheet(${JSON.stringify(n).replace(/"/g, "&quot;")})">${esc(n.trim())}</button>`).join("")}
        </div>`);
    })
    .catch((e) => { console.error(e); toast("Kon het Excel-bestand niet lezen."); });
  input.value = "";
}

const KLEUR_POOL = ["#0a84ff","#ff9f0a","#30d158","#bf5af2","#ff375f","#64d2ff","#ffd60a","#5e5ce6","#ff453a","#40c8e0","#ac8e68","#8e8e93"];
function addCategory(name, kind, glyph) {
  name = String(name || "").trim();
  if (!name) return null;
  const ex = state.config.cats.find((c) => c.name.toLowerCase() === name.toLowerCase());
  if (ex) return ex.id;
  let id = name.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "").slice(0, 20) || "label";
  if (state.config.cats.some((c) => c.id === id)) id = id + "-" + uid().slice(0, 4);
  state.config.cats.push({ id, name, color: KLEUR_POOL[state.config.cats.length % KLEUR_POOL.length],
    glyph: (glyph || "🏷️").slice(0, 4), kind: kind || "expense", budget: null });
  saveConfig();

}
function applyLabel(payee, catId, dirty) {
  const kw = payee.toLowerCase().slice(0, 30);
  if (!state.config.rules.some((r) => r.kw === kw)) state.config.rules.push({ kw, cat: catId });
  for (const [ym, list] of Object.entries(state.months))

function flushMonths(dirty) { for (const ym of dirty) saveMonth(ym); if (dirty.size) saveConfig(); }
async function aiLabel() {
  if (!SAMPLE) { toast("AI is in deze weergave niet beschikbaar."); return; }
  const un = allTx().filter((t) => !t.cat);
  if (!un.length) { toast("Alles heeft al een label. 🙌"); return; }
  const groups = {};
  for (const t of un) {
    const k = t.payee.trim();
    if (!groups[k]) groups[k] = { n: 0, sum: 0, desc: t.desc || "" };

  }

  openSheet(`<div class="grab"></div><h3>🤖 AI labelt je uitgaven…</h3>

  const prompt = `Je categoriseert betalingen voor een Nederlandse persoonlijke-financiën-app.

${JSON.stringify(state.config.cats.map((c) => ({ id: c.id, naam: c.name, soort: c.kind })))}

${JSON.stringify(top.map(([naam, g]) => ({ naam, omschrijving: g.desc.slice(0, 60), keer: g.n, gemiddeld_euro: Math.round(g.sum / g.n / 100) })))}

Antwoord met ALLEEN een JSON-array, één object per tegenpartij:

/* ========== betaalplan-herinneringen (.ics via agenda) ========== */
function planDebts() { return state.fixed.debts.filter((d) => d.plan && d.planDay && d.total - d.paid > 0); }
function nextPayDate(day) {
  const now = new Date();
  const d = new Date(now.getFullYear(), now.getMonth() + (now.getDate() > day ? 1 : 0), day);
  return d;
}
async function planIcs() {
  if (!DOWNLOADS) { toast("Downloaden is in deze weergave niet beschikbaar."); return; }
  const pds = planDebts();
  if (!pds.length) { toast("Stel eerst bij een schuld een betaalplan in (bedrag + betaaldag)."); return; }
  const pad = (n) => String(n).padStart(2, "0");
  const lines = ["BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//FinSight//Betaalplan//NL", "X-WR-CALNAME:FinSight betaalplan"];
  for (const d of pds) {
    const count = Math.max(1, Math.ceil((d.total - d.paid) / d.plan));
    const start = nextPayDate(d.planDay);
    const dt = `${start.getFullYear()}${pad(start.getMonth() + 1)}${pad(start.getDate())}T090000`;
    const escT = (s) => String(s).replace(/\\/g, "\\\\").replace(/;/g, "\\;").replace(/,/g, "\\,");
    lines.push("BEGIN:VEVENT",
      `UID:finsight-plan-${d.id}@finsight`,
      `DTSTART:${dt}`,
      `RRULE:FREQ=MONTHLY;BYMONTHDAY=${d.planDay};COUNT=${count}`,
      `SUMMARY:${escT(`Aflossen: ${d.name} — ${euro(d.plan)}`)}`,
      `DESCRIPTION:${escT(`Betaalplan FinSight. Nog open bij start: ${euro(d.total - d.paid)} (${count} termijnen).`)}`,
      "BEGIN:VALARM", "ACTION:DISPLAY", `DESCRIPTION:${escT(`Vandaag aflossen: ${d.name} ${euro(d.plan)}`)}`, "TRIGGER:-PT1H", "END:VALARM",
      "END:VEVENT");
  }
  lines.push("END:VCALENDAR");
  try {
    await DOWNLOADS.save({ filename: "finsight-betaalplan.ics", data: new Blob([lines.join("\r\n")], { type: "text/calendar" }) });
    toast("Agenda-bestand klaargezet — open het en voeg toe aan je agenda voor meldingen.");
  } catch (e) { console.error(e); toast("Opslaan geannuleerd."); }
}
function viewLasten() {
  const who = state.fixedWho;
  const match = (w) => !who || (who === "_samen" ? !w : String(w || "").toLowerCase() === who.toLowerCase());
  const items = state.fixed.items.filter((i) => match(i.who));
  const debts = state.fixed.debts.filter((d) => match(d.who || ""));
  const persons = fixedPersons();
  const lasten = items.filter((i) => i.amount > 0).reduce((a, b) => a + b.amount, 0);
  const inkomsten = -items.filter((i) => i.amount < 0).reduce((a, b) => a + b.amount, 0);
  const ruimte = inkomsten - lasten;
  const open = debts.reduce((a, d) => a + (d.total - d.paid), 0);
  const direct = debts.filter((d) => d.status === "direct" || d.status === "uitstel").reduce((a, d) => a + (d.total - d.paid), 0);
  const groups = [...new Set(items.map((i) => i.group || "Algemeen"))];
  const sim = state.debtSim ?? (ruimte > 0 ? Math.round(ruimte / 2) : 0);

    return `<div class="card" style="padding:10px 16px">

        <div class="tamt num ${i.amount < 0 ? "in" : ""}">${euroS(-i.amount)}</div>
      </div>`).join("")}</div>
      <button class="btn sec sm" style="margin:8px 0" onclick="openFixedItem()">+ Post toevoegen</button>
    </div>`;
  }).join("")}
  ${planDebts().length ? (() => {
    const pds = planDebts().map((d) => ({ d, next: nextPayDate(d.planDay) })).sort((a, b) => a.next - b.next);
    return `<div class="card">

    <div class="rows">${pds.map(({ d, next }) => `<div class="trow" onclick="openDebt('${d.id}')">
      <div class="tmain"><div class="tname">${esc(d.name)}</div><div class="tsub">${next.getDate()} ${MONTH_NAMES[next.getMonth()]} · nog ${Math.max(1, Math.ceil((d.total - d.paid) / d.plan))} termijnen</div></div>
      <div class="tamt num">${euro(Math.min(d.plan, d.total - d.paid))}</div></div>`).join("")}</div></div>`;
  })() : ""}
  <div class="card">

    </div>
    <div class="rows" style="margin-top:8px">${debts.map((d) => {
      const st = DEBT_STATUS[d.status] ?? DEBT_STATUS.open;

      return `<div class="trow" onclick="openDebt('${d.id}')">
        <div class="tmain">
          <div class="tname">${esc(d.name)}</div>
          <div class="tsub"><span style="color:${st.color}">● ${st.label}</span>${d.paid ? ` · ${pct}% afgelost` : ""}</div>
          ${d.paid ? `<div class="bar" style="margin-top:5px;height:4px"><i style="width:${pct}%;background:var(--green)"></i></div>` : ""}

  </div>
  ${open > 0 ? `<div class="card">
    <h2>Aflossingsplan</h2>
    <p class="muted" style="margin:6px 0 10px">Hoeveel kun je per maand aflossen?</p>
    <div class="row" style="flex-wrap:nowrap">
      <input inputmode="decimal" value="${(sim/100).toString().replace(".", ",")}" onchange="simDebt(this.value)" style="width:120px" id="simfield">
      <div class="small" style="flex:1;color:var(--ink-2)">${simMonths ? `→ schuldenvrij over <b style="color:var(--ink)">~${simMonths} maanden</b> (${simDate})` : "Vul een bedrag in om je aflosdatum te zien."}</div>
    </div>
    ${ruimte > 0 && sim > ruimte ? `<p class="muted" style="margin-top:8px;color:var(--orange)">Let op: dit is meer dan je maandruimte van ${euro(ruimte)}.</p>` : ""}

}

/* ========== views ========== */
function viewEmpty() {

    <div class="formgrid" style="max-width:280px;margin:0 auto">
      <button class="btn" onclick="loadDemo()">Demodata laden</button>
      <button class="btn sec" onclick="go('tx')">Zelf beginnen</button>
    </div>
  </div>`;
}
function dashMonths() {
  const set = new Set(allTx().map((t) => t.date.slice(0,7)));
  set.add(dezeMaand());
  return [...set].sort();
}
function shiftMonth(d) {
  const months = dashMonths();
  const cur = state.mSel || dezeMaand();
  const i = Math.min(Math.max(months.indexOf(cur) + d, 0), months.length - 1);
  state.mSel = months[i] === dezeMaand() ? null : months[i];
  render();
}
/* Eerlijke vergelijking met vorige maand: voor de lopende maand telt de vorige maand alleen t/m dezelfde dag mee. */
function expenseCompare(month) {
  const months = dashMonths();
  const i = months.indexOf(month);
  if (i <= 0) return null;
  const prev = months[i - 1];
  const partial = month === dezeMaand();
  const dayCap = new Date().getUTCDate();
  const sum = (ym, cap) => allTx().filter((t) => t.amount < 0 && !isTransfer(t) && t.date.slice(0,7) === ym && (!cap || +t.date.slice(8) <= cap)).reduce((a,t) => a + -t.amount, 0);
  const curS = sum(month, null), prevS = sum(prev, partial ? dayCap : null);
  if (prevS < 2000) return null;
  return Math.round(((curS - prevS) / prevS) * 100);
}
function lastenKaart() {
  if (!(state.fixed.items.length || state.fixed.debts.length)) return "";
  const fwho = state.fixedWho;
  const mw = (w) => !fwho || (fwho === "_samen" ? !w : String(w || "").toLowerCase() === fwho.toLowerCase());
  const fi = state.fixed.items.filter((i) => mw(i.who));
  const ruimte = -fi.reduce((a, b) => a + b.amount, 0);
  const open = state.fixed.debts.filter((d) => mw(d.who || "")).reduce((a, d) => a + (d.total - d.paid), 0);
  const direct = state.fixed.debts.filter((d) => mw(d.who || "") && (d.status === "direct" || d.status === "uitstel")).reduce((a, d) => a + (d.total - d.paid), 0);
  return `<div class="card" style="cursor:pointer;padding:14px 16px" onclick="go('lasten')">
    <div class="row spread"><h2>Lasten &amp; schulden${fwho ? ` · ${fwho === "_samen" ? "gezamenlijk" : esc(fwho)}` : ""}</h2><span class="muted">›</span></div>
    <div class="chips" style="display:flex;gap:8px;flex-wrap:wrap;margin-top:8px">
      <span class="pill">maandruimte <b class="num" style="color:${ruimte < 0 ? "var(--red)" : "var(--green)"}">&nbsp;${euro(ruimte)}</b></span>
      ${open ? `<span class="pill">schuld open <b class="num">&nbsp;${euro(open)}</b></span>` : ""}
      ${direct ? `<span class="pill" style="color:var(--red)">⚠ nu te betalen <b class="num">&nbsp;${euro(direct)}</b></span>` : ""}
    </div></div>`;
}
function viewDash() {
  const hasFixed = state.fixed.items.length || state.fixed.debts.length;
  if (!allTx().length && !hasFixed) return viewEmpty();
  if (!allTx().length) {
    return `
    <div><h1 class="page">Home</h1><div class="sub">${maandNaam(dezeMaand())}</div></div>
    ${lastenKaart()}
    <div class="card" style="padding:14px 16px">
      <h2>Banktransacties</h2>
      <p class="muted" style="margin:6px 0 12px">Nog geen transacties. Importeer je bankafschrift (CSV of Excel) of scan een bon — dan zie je hier je saldo, uitgaven per categorie en trends naast je vaste lasten.</p>
      <div class="formgrid">

  const cur = stats.find((s) => s.month === month) || { income: 0, expense: 0 };
  const perCat = spendPerCat(month);
  const rec = detectRecurring();

  const rate = savingsRate(month);
  const recMonthly = rec.filter((r) => r.intervalDays > 20 && r.intervalDays < 40).reduce((a,b) => a + b.avgAmount, 0);
  const recent = allTx().slice(0, 5);
  return `
  <div class="row spread" style="flex-wrap:nowrap">

    <button class="iconbtn" onclick="shiftMonth(1)" ${mi >= months.length - 1 ? "disabled style='opacity:0.3'" : ""} aria-label="Volgende maand">›</button>
  </div>
  ${(() => {
    const sp6 = stats.slice(-6);

    const spark = sp6.length > 1 ? `<div class="sparkA">${sp6.map((s) => `<i class="${s.month === month ? "hi" : ""}" style="height:${Math.max(9, Math.round(s.expense / mx * 100))}%;cursor:pointer" onclick="state.mSel='${s.month}';render()" title="${maandNaam(s.month)}"></i>`).join("")}</div>` : "";
    return `<div class="card hero heroA">
    <div class="lbl">${state.hh ? "Saldo · 🏘️ Immanuelkantstraat" : "Totaal saldo"}</div>
    <div class="big num">${euro(saldo())}</div>
    <div class="chips">
      <span class="pill num">↑ ${euro(cur.income)} in</span>
      <span class="pill num" onclick="drill('','${month}')" style="cursor:pointer">↓ ${euro(cur.expense)} uit</span>
      ${hasCash() && !state.hh ? `<span class="pill num" onclick="openKluis()" style="cursor:pointer">💶 ${euro(cashSaldo())} kluis</span>` : ""}
      ${rate != null && rate >= 0 ? `<span class="pill num">💰 ${rate}% gespaard</span>` : ""}
      ${cmp != null ? `<span class="pill num">${cmp <= 0 ? "📉" : "📈"} ${cmp > 0 ? "+" : ""}${cmp}% vs vorige mnd</span>` : ""}
    </div>
    ${spark}
  </div>`;
  })()}
  ${waarStaIk()}
  ${anom.length ? `<div class="card" style="border-color:rgba(255,159,10,0.35)">
    <div class="row" style="gap:10px"><span style="font-size:20px">⚠️</span><div style="flex:1">
      <b style="font-size:14.5px">Opvallend: ${esc(anom[0].name)}</b>
      <div class="muted">${euro(anom[0].thisMonth)} deze maand — ${anom[0].pct}% boven je gemiddelde</div></div></div></div>` : ""}
  ${lastenKaart()}
  <div class="card"><h2>Deze maand per categorie</h2>
    <div class="row" style="margin-top:12px;align-items:center;gap:18px">
      ${chartDonut(perCat.slice(0,8).map((c) => ({ label: c.cat?.name || "Overig", value: c.total, color: c.cat?.color || "#8e8e93" })))}
      <div style="flex:1;min-width:150px">${perCat.slice(0,5).map((c) => `<div class="row spread" style="padding-block:4px;font-size:13.5px;flex-wrap:nowrap;cursor:pointer" onclick="${c.cat ? `openCatDetail('${c.cat.id}')` : `drill('none','${month}')`}">
        <span class="row" style="gap:8px;flex-wrap:nowrap;min-width:0"><span class="dotl" style="background:${c.cat?.color || "#8e8e93"};margin:0"></span><span style="color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(c.cat?.name || "Ongecategoriseerd")}</span></span>
        <b class="num" style="white-space:nowrap">${euro(c.total)}</b></div>`).join("")}</div>
    </div></div>
  <div class="card"><h2>Inkomsten vs. uitgaven</h2><div style="margin-top:12px">${chartBars(stats)}</div></div>
  <div class="card">
    <div class="row spread"><h2>Vaste lasten</h2><button class="btn sec sm" onclick="go('abos')">Alles</button></div>
    <div class="muted" style="margin-top:4px">${euro(recMonthly)} per maand gedetecteerd</div>
    <div class="rows" style="margin-top:6px">${rec.slice(0,4).map((r) => `<div class="trow" onclick="go('abos')">${cicon(catById(r.cat), 38)}

      <div class="tamt num">${euro(r.avgAmount)}</div></div>`).join("")}</div></div>
  <div class="card">
    <div class="row spread"><h2>Recent</h2><button class="btn sec sm" onclick="go('tx')">Alles</button></div>
    <div class="rows" style="margin-top:6px">${recent.map(txRow).join("")}</div></div>`;
}
/* Alles in één oogopslag: alle potjes + schuld = netto positie. */
function waarStaIk() {
  if (state.hh) return "";
  const bank = saldo(), kluis = cashSaldo(), spaar = spaarSaldo();
  const kant = hasKant() ? kantSaldo() : null;
  const bezit = bank + kluis + spaar + (kant || 0);

  const rij = (glyph, naam, bedrag, click, sub) => `

      <span style="font-size:19px;width:30px;text-align:center;flex:none">${glyph}</span>

      <div class="tamt num" style="color:${bedrag < 0 ? "var(--red)" : "var(--ink)"}">${euro(bedrag)}</div>

    </div>`;
  return `
  <div class="card" style="padding:10px 16px 12px">
    <div class="row spread" style="padding:6px 2px 2px"><h2>Waar sta ik?</h2><span class="muted" style="font-size:12px">al je potjes bij elkaar</span></div>

      ${rij("🏦", "Bank", bank, "openCalibrate()")}
      ${rij("💶", "Cash-kluis", kluis, "openKluis()")}
      ${rij("🐷", "Spaarpot", spaar, "openSpaar()")}
      ${kant != null ? rij("🏘️", "Immanuelkantstraat", kant, "toggleHh()", "aparte woning — tik om te wisselen")
        : `<div class="trow" style="padding:9px 2px" onclick="toggleHh()">
            <span style="font-size:19px;width:30px;text-align:center;flex:none">🏘️</span>
            <div class="tmain"><div class="tname" style="font-size:14.5px">Immanuelkantstraat</div><div class="tsub">aparte woning — tik om te wisselen ⇄</div></div>
            <span class="muted" style="font-size:12.5px">nog leeg</span>
            <span class="chev" style="color:var(--ink-3)">›</span></div>`}
    </div>
    <div class="row spread" style="border-top:1px solid var(--hair);padding:9px 2px 2px;font-size:14px"><b>Totaal bezit</b><b class="num">${euro(bezit)}</b></div>
    ${(() => {
      const doelen = (state.config.goals || []).filter((g) => g.saved > 0);
      const opzij = doelen.reduce((a, g) => a + g.saved, 0);
      const vrij = bezit - opzij - schuld;
      return `
      ${doelen.length
        ? `<div class="row spread" style="padding:7px 2px 2px;font-size:14px;cursor:pointer;flex-wrap:nowrap" onclick="go('doelen')"><span style="color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">🎯 Opzij in ${doelen.length === 1 ? `potje "${esc(doelen[0].name)}"` : doelen.length + " potjes"}</span><b class="num" style="color:var(--orange);white-space:nowrap">− ${euro(opzij)}</b></div>`
        : `<div class="row spread" style="padding:7px 2px 2px;font-size:13.5px;cursor:pointer" onclick="openGoal()"><span style="color:var(--blue)">🎯 ＋ Maak een potje (bijv. Verhuizing)</span><span class="chev">›</span></div>`}
      ${schuld > 0 ? `<div class="row spread" style="padding:7px 2px 2px;font-size:14px;cursor:pointer" onclick="go('lasten')"><span style="color:var(--ink-2)">🧾 Schuld open</span><b class="num" style="color:var(--red)">− ${euro(schuld)}</b></div>` : ""}
      ${schuld > 0 || opzij > 0 ? `<div class="row spread" style="border-top:1px solid var(--hair);margin-top:7px;padding:9px 2px 2px;font-size:15px"><b>${opzij > 0 ? "Vrij besteedbaar" : "Netto positie"}</b><b class="num" style="color:${(opzij > 0 ? vrij : netto) < 0 ? "var(--red)" : "var(--green)"}">${euroS(opzij > 0 ? vrij : netto)}</b></div>` : ""}
      ${opzij > 0 && schuld > 0 ? `<p class="muted" style="margin:2px 2px 4px;font-size:11.5px">Netto positie (bezit − schuld): <b class="num">${euroS(netto)}</b> · potjes tellen als gereserveerd</p>` : ""}`;
    })()}
  </div>`;
}
function txRow(t) {

function weekNr(d) {

  t.setUTCDate(t.getUTCDate() + 4 - (t.getUTCDay() || 7));

/* ===== Inzichten in "kaarten-flow" (optie A) ===== */
function periodeKolommen(mode, stats) {
  const today = new Date();
  const iso = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
  const cols = [];
  if (mode === "jaar") {
    const jaren = [...new Set(allTx().map((t) => t.date.slice(0, 4)))].sort().slice(-6);
    if (!jaren.length) jaren.push(String(today.getFullYear()));
    return jaren.map((y) => ({ key: y, label: y, from: y + "-01-01", to: y + "-12-31" }));
  }
  if (mode === "maand")
    return stats.slice(-6).map((s) => ({ key: s.month, label: MONTH_NAMES[+s.month.slice(5) - 1], from: s.month + "-01", to: s.month + "-31", m: s.month }));
  if (mode === "week") {
    const ma = new Date(today); ma.setDate(ma.getDate() - ((ma.getDay() + 6) % 7));
    for (let i = 7; i >= 0; i--) {
      const van = new Date(ma); van.setDate(ma.getDate() - i * 7);
      const tot = new Date(van); tot.setDate(van.getDate() + 6);
      cols.push({ key: iso(van), label: "wk" + weekNr(van), from: iso(van), to: iso(tot) });
    }
    return cols;
  }
  for (let i = 9; i >= 0; i--) {
    const d = new Date(today); d.setDate(today.getDate() - i);
    cols.push({ key: iso(d), label: d.getDate() + "/" + (d.getMonth() + 1), from: iso(d), to: iso(d) });
  }
  return cols;
}
function inzichtA(stats) {
  const mode = state.hbMode || "maand";
  const cols = periodeKolommen(mode, stats);
  if (!cols.length) return "";
  const lo = cols[0].from, hi = cols[cols.length - 1].to;
  const per = {}, inc = {}, uit = {};
  for (const t of allTx()) {
    if (t.date < lo || t.date > hi || isTransfer(t)) continue;
    const c = cols.find((x) => t.date >= x.from && t.date <= x.to);
    if (!c) continue;
    if (t.amount > 0) { inc[c.key] = (inc[c.key] || 0) + t.amount; continue; }
    uit[c.key] = (uit[c.key] || 0) - t.amount;
    const k = t.cat || "_none";
    const p = per[k] = per[k] || { m: {}, n: {} };
    p.m[c.key] = (p.m[c.key] || 0) - t.amount;
    p.n[c.key] = (p.n[c.key] || 0) + 1;
  }
  const cur = cols[cols.length - 1], prev = cols[cols.length - 2];
  const curIn = inc[cur.key] || 0, curUit = uit[cur.key] || 0, netto = curIn - curUit;
  const maxUit = Math.max(1, ...cols.map((c) => uit[c.key] || 0));
  const spark = cols.length > 1 ? `<div class="sparkA">${cols.map((c, i) => `<i class="${i === cols.length - 1 ? "hi" : ""}" style="height:${Math.max(9, Math.round((uit[c.key] || 0) / maxUit * 100))}%"></i>`).join("")}</div>` : "";
  const perLabel = mode === "jaar" ? cur.label : mode === "maand" ? maandNaam(cur.m) : mode === "week" ? `deze week (${datum(cur.from)} – ${datum(cur.to)})` : "vandaag";
  const rijen = Object.entries(per).map(([id, p]) => ({
    id, cat: id === "_none" ? null : catById(id), m: p.m,
    cur: p.m[cur.key] || 0, prev: prev ? p.m[prev.key] || 0 : 0, n: p.n[cur.key] || 0,
    tot: Object.values(p.m).reduce((a, b) => a + b, 0),
  })).sort((a, b) => (b.cur - a.cur) || (b.tot - a.tot));
  const eenheid = mode === "jaar" ? "dit jaar" : mode === "maand" ? "deze maand" : mode === "week" ? "deze week" : "vandaag";
  const kaart = (r) => {
    const c = r.cat;
    const mx = Math.max(1, ...cols.map((x) => r.m[x.key] || 0));
    const bars = cols.map((x, i) => `<i class="${i === cols.length - 1 ? "hi" : ""}" style="height:${Math.max(2, Math.round((r.m[x.key] || 0) / mx * 26))}px"></i>`).join("");
    let delta = "";
    if (r.prev > 0 && r.cur > 0) {
      const p = Math.round((r.cur - r.prev) / r.prev * 100);
      if (p) delta = `<div class="tsub num" style="color:${p > 0 ? "var(--red)" : "var(--green)"}">${p > 0 ? "▲" : "▼"} ${Math.abs(p)}%</div>`;
    } else if (!r.cur && r.prev > 0) delta = `<div class="tsub num" style="color:var(--green)">▼ was ${euroK(r.prev)}</div>`;
    return `<div class="trow" onclick="${c ? `openCatDetail('${r.id}')` : `drill('none','')`}">
      ${cicon(c || { color: "#8e8e93", glyph: "❔" }, 40)}
      <div class="tmain"><div class="tname">${esc(c?.name || "Zonder label")}</div><div class="tsub">${r.n ? r.n + "× " + eenheid : "niets " + eenheid}${!c ? " · ✨ labelen" : ""}</div></div>
      <div class="minibars">${bars}</div>
      <div style="text-align:right;min-width:72px"><div class="tamt num">${euro(r.cur)}</div>${delta}</div>
    </div>`;
  };
  const drillCur = mode === "maand" ? `drill('','${cur.m}')` : `drillRange('','${cur.from}','${cur.to}','${cur.label}')`;
  return `
  <div class="card hero heroA">
    <div class="lbl">Netto · ${perLabel}</div>
    <div class="big num" style="font-size:34px">${netto < 0 ? "− " : "+ "}${euro(Math.abs(netto))}</div>
    <div class="chips">
      <span class="pill num">↑ ${euro(curIn)} in</span>
      <span class="pill num" onclick="${drillCur}" style="cursor:pointer">↓ ${euro(curUit)} uit</span>
      ${hasCash() && !state.hh ? `<span class="pill num" onclick="openKluis()" style="cursor:pointer">💶 ${euro(cashSaldo())} kluis</span>` : ""}
    </div>
    ${spark}
  </div>
  <div class="row spread" style="margin:2px 2px 6px"><h2>Waar ging het heen?</h2><span class="muted" style="font-size:12px">tik voor detail ›</span></div>
  <div class="card" style="padding:4px 14px"><div class="rows">
    ${rijen.length ? rijen.map(kaart).join("") : '<p class="muted" style="padding:14px 2px">Geen uitgaven in deze periode.</p>'}
  </div></div>
  ${cols.length > 1 ? `<p class="muted" style="text-align:center;margin:-2px 0 10px;font-size:12px">Staafjes = laatste ${cols.length} ${mode === "jaar" ? "jaren" : mode === "maand" ? "maanden" : mode === "week" ? "weken" : "dagen"} · blauw = nu · tik ↓ uit voor alle transacties</p>` : ""}`;
}

  const rate = savingsRate(month);
  const net = avgNet();
  const perCat = spendPerCat(month);
  const rec = detectRecurring();
  const tips = [];
  const avgExp = (() => { const d = stats.filter((s) => s.month < month).slice(-3); return d.length ? d.reduce((a,b) => a + b.expense, 0)/d.length : 0; })();
  if (net < 0) tips.push(["📉", `Je geeft gemiddeld ${euro(-Math.round(net))} per maand méér uit dan er binnenkomt.`]);
  if (avgExp > 0 && saldo() < avgExp*3) tips.push(["🛟", `Je buffer (${euro(saldo())}) is kleiner dan 3 maanden aan uitgaven. 3–6 maanden is een gezonde basis.`]);
  const subs = rec.filter((r) => r.intervalDays >= 23 && r.intervalDays <= 38 && r.avgAmount < 5000);
  if (subs.length >= 3) tips.push(["🔁", `${subs.length} kleinere maandabonnementen, samen ${euro(subs.reduce((a,b) => a + b.avgAmount, 0))}/maand. Gebruik je ze allemaal nog?`]);
  if (rate != null && rate >= 20) tips.push(["🏆", `Sterk: je spaarquote van ${rate}% zit boven de 20%-richtlijn.`]);
  else if (rate != null && rate >= 0) tips.push(["💪", `Je spaarquote is ${rate}%. Richtlijn: probeer richting 20% te sparen.`]);
  if (perCat[0]?.cat) tips.push([perCat[0].cat.glyph, `Grootste uitgavenpost deze maand: ${perCat[0].cat.name} (${euro(perCat[0].total)}).`]);
  return `

    <p class="muted" style="margin:4px 0 8px;font-size:12px">Doorgetrokken lijn = je werkelijke saldo per maand · stippellijn = prognose bij je huidige tempo.</p>
    ${chartWealth(wealthSeries(), forecast(6))}</div>
  ${anom.length ? `<div class="card" style="border-color:rgba(255,159,10,0.35)"><h2 style="color:var(--orange)">Opvallende uitgaven</h2>
    <div class="rows" style="margin-top:6px">${anom.map((a) => `<div class="trow" style="cursor:default"><span class="cicon" style="background:${tint(a.color,0.16)};width:38px;height:38px;font-size:17px">${a.glyph}</span>
      <div class="tmain"><div class="tname">${esc(a.name)}</div><div class="tsub">gemiddeld ${euro(a.avg)}</div></div>
      <div style="text-align:right"><div class="tamt num">${euro(a.thisMonth)}</div><div class="tsub" style="color:var(--orange)">+${a.pct}%</div></div></div>`).join("")}</div></div>` : ""}
  <div class="card"><h2>Voor jou</h2>
    <div class="rows" style="margin-top:6px">${tips.map(([g, t]) => `<div class="trow" style="cursor:default"><span style="font-size:20px;flex:none;width:30px;text-align:center">${g}</span><div class="tmain" style="white-space:normal"><div style="font-size:13.5px;color:var(--ink-2)">${t}</div></div></div>`).join("") || '<p class="muted">Voeg meer transacties toe voor persoonlijke tips.</p>'}</div></div>
  <div class="card"><h2>Maandoverzicht</h2><div style="overflow-x:auto;margin-top:10px"><table>
    <tr><th>Maand</th><th class="r">In</th><th class="r">Uit</th><th class="r">Netto</th></tr>
    ${stats.slice().reverse().map((s) => `<tr><td>${MONTH_NAMES[+s.month.slice(5)-1]} ${s.month.slice(0,4)}</td><td class="r num">${euro(s.income)}</td><td class="r num">${euro(s.expense)}</td><td class="r num" style="color:${s.net < 0 ? "var(--red)" : "var(--green)"};font-weight:600">${euroS(s.net)}</td></tr>`).join("")}
  </table></div></div>`;

/* ========== thema, export & haptiek ========== */
function getThemePref() { try { return localStorage.getItem("fs_theme") || "light"; } catch { return "light"; } }
function applyTheme() {
  const t = getThemePref();
  const r = document.documentElement;
  if (t === "light" || t === "dark") r.dataset.theme = t;
  else delete r.dataset.theme;
}
function themeLabel() { const t = getThemePref(); return t === "dark" ? "Donker" : t === "light" ? "Licht" : "Systeem (telefoon)"; }
function themeGlyph() { const t = getThemePref(); return t === "dark" ? "🌙" : t === "light" ? "☀️" : "📱"; }
function cycleTheme() {
  const order = ["light", "dark", ""];
  const next = order[(order.indexOf(getThemePref() === "light" ? "light" : getThemePref()) + 1) % 3];
  try { next ? localStorage.setItem("fs_theme", next) : localStorage.setItem("fs_theme", "system"); } catch {}
  applyTheme(); render();
}
function buzz() { try { if (navigator.vibrate) navigator.vibrate(8); } catch {} }
function openCalibrate() {
  openSheet(`
    <div class="grab"></div>
    <h3>⚖️ Saldo kalibreren · ${HH_NAAM[state.hh]}</h3>

/* Bon in de kluis: AI leest de bon, labelt hem en slaat hem direct op als cash-uitgave. */
function scanBon(input) {
  const file = input.files?.[0];
  input.value = "";
  if (!file) return;
  if (!canScan()) { toast("Scannen is in deze weergave niet beschikbaar."); return; }
  openSheet(`<div class="grab"></div><h3>📷 Bon scannen</h3>
    <p class="muted" style="margin-top:8px">AI leest je bon en zet hem direct als cash-uitgave in de kluis, met het juiste label.</p>
    <p class="muted" style="margin-top:10px">Bezig met lezen…</p>`);
  const catList = state.config.cats.filter((c) => c.kind === "expense" && c.id !== "kluis").map((c) => `"${c.id}" (${c.name})`).join(", ");
  const prompt = `Je krijgt een foto van een kassabon of betaalbewijs (Nederlands). Haal de kerngegevens eruit.
Antwoord met ALLEEN dit JSON-object, zonder tekst eromheen:
{"winkel":"naam van de winkel/zaak","bedrag":totaalbedrag in euro als positief getal,"datum":"YYYY-MM-DD" van de bon of null,"label":het best passende label-id uit deze lijst of null,"omschrijving":"korte omschrijving van wat er gekocht is"}
Mogelijke labels: ${catList}. Kies het label dat het best past bij wat er op de bon staat; twijfel je, gebruik null.`;
  SAMPLE.json(prompt, { images: file, cache: false })
    .then((d) => {
      const bedrag = typeof d?.bedrag === "number" && isFinite(d.bedrag) ? Math.round(Math.abs(d.bedrag) * 100) : 0;
      if (!bedrag) throw { code: "invalid_json" };
      const payee = String(d.winkel || "Bon").slice(0, 60);
      const desc = String(d.omschrijving || "").slice(0, 90);
      const date = /^\d{4}-\d{2}-\d{2}$/.test(d.datum || "") ? d.datum : vandaag();
      const aiCat = catById(d.label);
      const cat = aiCat && aiCat.kind === "expense" && aiCat.id !== "kluis" ? aiCat.id : autoCat(payee, desc, -bedrag);
      const ym = date.slice(0, 7);
      (state.months[ym] = state.months[ym] || []).push({ id: uid(), date, amount: -bedrag, payee, desc, cat, acc: "cash" });
      saveMonth(ym); render(); openKluis();
      toast(`📷 ${euro(bedrag)} · ${payee}${cat ? ` · ${catById(cat).name}` : ""} — opgeslagen uit de kluis. Tik erop om aan te passen.`);
    })
    .catch((e) => {
      console.error(e);
      const msg = {
        not_granted: "Je hebt AI-gebruik voor deze app niet toegestaan.",
        refused: "De AI kon of mocht deze bon niet verwerken.",

      }[e?.code] || "Scannen mislukte — probeer het opnieuw.";
      openKluis();
      toast(msg);
    });
}

async function exportCsv() {

/* Excel-ondersteuning: SheetJS wordt pas geladen wanneer iemand echt een .xlsx kiest. */
let xlsxLoading = null;
function loadXLSX() {
  if (window.XLSX) return Promise.resolve();
  if (!xlsxLoading) {
    xlsxLoading = new Promise((resolve, reject) => {
      const s = document.createElement("script");
      s.src = "https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js";
      s.onload = resolve;
      s.onerror = () => { xlsxLoading = null; reject(new Error("xlsx load")); };
      document.head.appendChild(s);
    });
  }
  return xlsxLoading;
}
function importCsv(input) {
  const file = input.files?.[0];
  if (!file) return;
  const isExcel = /\.(xlsx|xls)$/i.test(file.name);
  const read = isExcel
    ? loadXLSX()
        .then(() => file.arrayBuffer())
        .then((buf) => {
          const wb = XLSX.read(buf, { type: "array", cellDates: true, dateNF: "yyyy-mm-dd" });
          const ws = wb.Sheets[wb.SheetNames[0]];
          return XLSX.utils.sheet_to_csv(ws, { FS: ";" });
        })
    : file.text();
  read.then((content) => {
    const { bank, rows } = parseBankCsv(content);
    if (!rows.length) { toast("Geen transacties herkend. Ondersteund: ING, Rabobank, ABN AMRO en generieke CSV."); return; }
    // Dubbel-detectie die échte herhaalde betalingen (zelfde dag, bedrag én naam) niet wegfiltert:
    // een regel is pas dubbel als de app al evenveel exemplaren van exact die combinatie heeft.
    const have = {};
    for (const t of allTx()) { const k = t.date + "|" + t.amount + "|" + t.payee; have[k] = (have[k] || 0) + 1; }
    const inFile = {};
    let ok = 0, dup = 0;
    for (const r of rows) {
      const key = r.date + "|" + r.amount + "|" + r.payee;
      inFile[key] = (inFile[key] || 0) + 1;
      if (inFile[key] <= (have[key] || 0)) { dup++; continue; }
      const ym = r.date.slice(0,7);
      const tnew = { id: uid(), date: r.date, amount: r.amount, payee: r.payee, desc: r.desc, cat: autoCat(r.payee, r.desc, r.amount) };
      if (state.hh) tnew.hh = state.hh;
      (state.months[ym] = state.months[ym] || []).push(tnew);
      ok++;
    }
    for (const ym of Object.keys(state.months)) saveMonth(ym);
    render();
    buzz();
    toast(`${ok} transacties geïmporteerd (${bank}) in ${HH_NAAM[state.hh]}${dup ? `, ${dup} dubbele overgeslagen` : ""}.`);
  }).catch((e) => {
    console.error(e);
    toast(isExcel ? "Kon het Excel-bestand niet lezen — probeer het nogmaals of gebruik CSV." : "Kon het bestand niet lezen.");
  });
  input.value = "";
}

/* ========== eigen-server modus (zonder claude.ai): login, database-API en bunq-sync ========== */
const SRV = { on: false, token: null };
window.FS_IBANS = { hoofd: "NL61BUNQ2042260150", spaar: "NL49BUNQ2105588271" };
async function srvFetch(path, opts = {}) {
  const r = await fetch(path, { ...opts, headers: { "Content-Type": "application/json", "Authorization": "Bearer " + (SRV.token || ""), ...(opts.headers || {}) } });
  if (r.status === 401) { await srvLogin(); return srvFetch(path, opts); }
  if (!r.ok) throw new Error("server " + r.status);
  return r.json();
}
function srvLogin() {
  return new Promise((done) => {
    openSheet(`
      <div class="grab"></div>
      <h3>🔒 Inloggen</h3>
      <p class="muted" style="margin:6px 0 12px">Dit is jouw eigen FinSight-server. Vul je app-wachtwoord in (staat als APP_PASSWORD op de server).</p>
      <div class="formgrid">
        <label class="fl">Wachtwoord<input id="srv-pw" type="password" autocomplete="current-password"></label>
        <button class="btn" id="srv-go">Inloggen</button>
      </div>`);
    $("#srv-go").addEventListener("click", async () => {
      buzz();
      const pw = $("#srv-pw").value;
      const r = await fetch("api/login", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ password: pw }) }).catch(() => null);
      if (!r || !r.ok) { toast("Wachtwoord klopt niet."); return; }
      SRV.token = pw;
      try { localStorage.setItem("fs_srv_token", pw); } catch {}
      closeSheet(); done();
    });
  });
}
async function serverDB() {
  SRV.on = true;
  try { SRV.token = localStorage.getItem("fs_srv_token") || null; } catch {}
  const ok = SRV.token && (await fetch("api/ping", { headers: { Authorization: "Bearer " + SRV.token } }).then((r) => r.ok).catch(() => false));
  if (!ok) await srvLogin();
  if (!DOWNLOADS) DOWNLOADS = { save: async ({ filename, data }) => {
    const u = URL.createObjectURL(data); const a = document.createElement("a");
    a.href = u; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(u), 5000);
  } };
  const snap = (d) => ({ exists: d.exists, data: () => d.data });
  const docs = (d) => ({ docs: d.docs.map((x) => ({ id: x.id, data: () => x.data })) });
  return {
    doc: (p) => ({
      get: async () => snap(await srvFetch("api/doc/" + p)),
      set: async (data) => { await srvFetch("api/doc/" + p, { method: "PUT", body: JSON.stringify({ data }) }); },
    }),
    collection: (name) => ({
      get: async () => docs(await srvFetch("api/col/" + name)),
      add: async (data) => { await srvFetch("api/col/" + name, { method: "POST", body: JSON.stringify({ data }) }); },
      orderBy: (f, dir) => ({ limit: (n) => ({ get: async () => docs(await srvFetch(`api/col/${name}?order=${f}&dir=${dir}&limit=${n}`)) }) }),
    }),
  };
}
/* Sync-bij-openen: de server haalt bunq op; de app dedupliceert en labelt met zijn eigen regels. */
async function serverSync(force) {
  if (!SRV.on) { toast("Bunq-verversen werkt alleen op je eigen server."); return; }
  const d = await srvFetch("api/bunq/rows?days=45" + (force ? "&force=1" : ""));
  if (d.error) { if (force) toast("Bunq: " + d.error); return; }
  const have = {};
  for (const t of allTxAll()) { const k = t.date + "|" + t.amount + "|" + t.payee; have[k] = (have[k] || 0) + 1; }
  const inF = {}; const dirty = new Set(); let nieuw = 0;
  const zonderLabel = [];
  for (const r of d.rows || []) {
    if (r.iban !== FS_IBANS.hoofd && r.iban !== FS_IBANS.spaar) continue;
    const k = r.date + "|" + r.amount + "|" + r.payee;
    inF[k] = (inF[k] || 0) + 1;
    if (inF[k] <= (have[k] || 0)) continue;
    const ym = r.date.slice(0, 7);
    const t = { id: uid(), date: r.date, amount: r.amount, payee: r.payee, desc: r.desc || "" };
    if (r.time) t.tijd = r.time;
    if (r.iban === FS_IBANS.spaar) { t.acc = "spaar"; t.cat = "potje"; t.desc = t.desc || "Mijn Doel 5000"; }
    else {
      t.cat = autoCat(r.payee, r.desc || "", r.amount);
      if (!t.cat && r.payee === "B. Ouwendijk" && r.amount < 0 && r.amount >= -100) t.cat = "potje";
      if (!t.cat && r.amount < 0) zonderLabel.push(r.payee);
    }
    (state.months[ym] = state.months[ym] || []).push(t);
    dirty.add(ym); nieuw++;
  }
  for (const ym of dirty) saveMonth(ym);
  // Nieuwe onbekende winkels? Meteen vragen — zo leert de app het snelst.
  let vragen = 0;
  if (zonderLabel.length) {
    const q = state.config.review = state.config.review || [];
    for (const p of [...new Set(zonderLabel)]) if (!q.some((x) => x.payee === p)) { q.push({ payee: p, n: zonderLabel.filter((x) => x === p).length }); vragen++; }
    if (vragen) saveConfig();
  }
  if (nieuw) { render(); toast(`🔄 ${nieuw} nieuwe van bunq${vragen ? ` · ${vragen} ${vragen === 1 ? "vraag" : "vragen"} voor jou` : ""}.`); }
  else if (force) toast("✓ Alles was al bij.");
  if (vragen) openReview();
}

async function boot() {
  applyTheme();
  const hash = (location.hash || "").slice(1);
  if (["dash","tx","budget","doelen","abos","inzicht","meer","lasten"].includes(hash)) state.tab = hash;
  render();
  state.config = { cats: CATS_DEFAULT.map((c) => ({ ...c })), rules: [], goals: [], startBalance: 0, review: [] };
  if (window.claude?.use) window.claude.use("downloads").then((d) => { DOWNLOADS = d; }).catch(() => {});
  if (window.claude?.use) window.claude.use("sample").then(async (s) => {
    SAMPLE = s;
    if (s) SCANLIM = await s.limits().catch(() => null);
    if (s) render();
  }).catch(() => {});
  if (window.claude?.use) {
    DB = await window.claude.use("db");
  } else if (location.protocol.startsWith("http")) {
    // Eigen server (bijv. Render): zelfde app, eigen database via de server-API.
    DB = await serverDB();
  }
  if (!DB) {
    state.loaded = true;
    render();
    toast("Niet verbonden — wijzigingen worden nu niet bewaard.");
    return;
  }
  FEEDBACK_COL = DB.collection("feedback");
  try {
    const [cfgSnap, monthsSnap, fbSnap, fixedSnap] = await Promise.all([
      DB.doc("meta/config").get(),
      DB.collection("months").get(),
      FEEDBACK_COL.orderBy("date", "desc").limit(100).get(),
      DB.doc("meta/fixed").get(),
    ]);
    if (fixedSnap.exists) {
      const f = fixedSnap.data();
      state.fixed = { items: f.items || [], debts: f.debts || [] };
      if (f.defaultWho) state.fixedWho = f.defaultWho;
    }
    if (cfgSnap.exists) {
      const c = cfgSnap.data();
      const defs = Object.fromEntries(CATS_DEFAULT.map((d) => [d.id, d]));
      const cats = (c.cats || []).map((x) => ({ ...defs[x.id], ...x, glyph: x.glyph || defs[x.id]?.glyph || "🏷️" }));
      for (const d of CATS_DEFAULT) if (!cats.some((x) => x.id === d.id)) cats.push({ ...d });
      state.config = { cats, rules: c.rules || [], goals: c.goals || [], startBalance: c.startBalance || 0, review: c.review || [] };
    }
    for (const d of monthsSnap.docs) state.months[d.id] = (d.data().txs || []);
    state.feedback = fbSnap.docs.map((d) => d.data());
    setSync(true);
  } catch (e) {
    console.error(e);
    toast("Laden mislukte — herlaad de pagina.");
  }
  state.loaded = true;
  render();
  if (SRV.on) {
    serverSync().catch((e) => console.error("bunq-sync:", e));
    // Ook verversen wanneer de app weer in beeld komt (terug uit achtergrond).
    document.addEventListener("visibilitychange", () => {
      if (!document.hidden && state.loaded) serverSync().catch(() => {});
    });
  }
}
boot();
